{k:"병아리 → 피닉스 모핑",show:F,tag:()=>"8프레임 · 1회 · 2줄(4+4) · 첨부 2장",ko:()=>MORPH.ko,p:()=>MORPH.en}
];
const nm2={quad:"네발",bird:"새",fish:"물고기",car:"차량",flyer:"비행"};
const gen=document.getElementById('gen'),sel=document.getElementById('ch'),list=document.getElementById('list'),ftp=document.getElementById('ftp'),note=document.getElementById('note');
function copy(txt,btn){const done=()=>{const o=btn.innerHTML;btn.innerHTML='<i class="ti ti-check" aria-hidden="true"></i> 복사됨';setTimeout(()=>btn.innerHTML=o,1400)};
const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();done()};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb)}else fb()}
function row(name,tag,ko,txt){const d=document.createElement('details');d.className='mrow';
d.innerHTML=`<summary><span class="nm">${name}</span><span class="tag">${tag}</span><button class="cp"><i class="ti ti-copy" aria-hidden="true"></i> 복사</button><i class="ti ti-chevron-down cv" aria-hidden="true"></i></summary><ol>${ko.map(x=>`<li>${x}</li>`).join('')}</ol>`;
d.querySelector('.cp').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();copy(txt,e.currentTarget)});list.appendChild(d)}
function fill(){sel.innerHTML='';(gen.value=="1"?G1.map(c=>c[0]):G2.map(c=>c.n+" · "+nm2[c.t])).forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t;sel.appendChild(o)});render()}
function render(){const g1=gen.value=="1",c=(g1?G1:G2)[sel.value],M=(g1?M1:M2).filter(m=>!m.show||m.show(c));list.innerHTML='';
ftp.textContent='따라오는 부위: '+(g1?c[5]:c.tk);
note.textContent=g1?(c[8]?'기본 자세 첨부: ① 원본 1차 시트 ② 파란 티 소년 idle → 결과를 idle 1프레임으로 첨부해 모션 생성':'첨부: 해당 캐릭터의 idle 1프레임 이미지'):c.note;
M.forEach(m=>row(m.name?m.name(c):m.k,m.tag(c),m.ko(c),m.p(c)));
if(g1&&c[11]){const h=document.createElement('p');h.className='sec';h.textContent=c[13]||'궁극기 · 5초 (등장 0.6초 → 쇼 3.8초 반복 → 등장 역재생 0.6초)';list.appendChild(h);c[11].forEach(u=>row(u.k,u.tag,u.ko,u.p))}}
gen.addEventListener('change',fill);sel.addEventListener('change',render);fill();
</script></div></body></html>
