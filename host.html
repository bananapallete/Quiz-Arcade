<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>퀴즈 게임 · 진행자</title>
    <style>:root{--cream:#e8d0a9;--cream-hi:#f6e6c8;--wood:#b27c53;--wood-dk:#7a4e32;--text:#5a3a24;--leaf:#b4d36a;--leaf-dk:#6e9a3a;--navy:#14122b;--gold:#f0a000;--rose:#e5483c;--sky:#4a86d9;--violet:#9a62d6;--green:#4fd16a;--yellow:#f2c230}
*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:#2b4d2a}
.px{border:4px solid var(--navy);box-shadow:0 5px 0 rgba(20,18,43,.45)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-weight:900;border:2px solid var(--navy);color:#fff;font-size:.9em}
.c-ind{background:var(--sky)}.c-team{background:var(--violet)}.c-real{background:var(--gold)}
.gauge{height:var(--gh,14px);background:#14122b55;border:3px solid var(--navy);border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(var(--c1,#7ee08a),var(--c2,#4fd16a))}
.gauge.mid i{--c1:#ffe27a;--c2:#f2c230}.gauge.low i{--c1:#ff8f84;--c2:#e5483c}
.floor{background:repeating-conic-gradient(#8fc27a 0 25%,#7db469 0 50%) 0 0/48px 48px}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--gold);border:2px solid var(--navy);vertical-align:-.1em}
</style>
    <style>
      body{width:100%;min-height:100vh;background:#243d2b;display:grid;grid-template-rows:56px auto minmax(0,1fr) 44px;gap:10px;padding:10px;font-size:15px;height:100vh}
      .bar{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--cream);border-radius:14px}.logo{font-weight:900;font-size:19px}
      .pill{padding:4px 12px;border-radius:99px;font-weight:900;border:2px solid var(--navy);background:var(--cream-hi)}
      .g{display:grid;grid-template-columns:300px minmax(0,1fr) 400px;gap:10px;min-height:0}
      .col{background:var(--cream);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;min-height:0;overflow:auto}
      h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}h3 em{margin-left:auto;font-style:normal;font-size:12px;opacity:.7}
      .q{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;min-width:0;gap:6px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--cream-hi);border:2px solid #d9bd8a;font-weight:800;font-size:14px}
      .q.cur{border-color:var(--navy);background:#fff3c4;box-shadow:0 3px 0 #14122b55}.q i{font-style:normal;width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);background:#fff;display:inline-block}.q.done i{background:var(--leaf)}.q.cur i{background:var(--gold)}
      .q span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
      button,select,input{font:inherit}
      .btn{padding:10px 14px;border-radius:12px;border:3px solid var(--navy);font-weight:900;font-size:15px;box-shadow:0 4px 0 #14122b66;background:var(--cream-hi);color:var(--text);text-align:center;cursor:pointer}
      .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14122b66}.btn[disabled]{opacity:.4;pointer-events:none}
      .btn.go{background:var(--leaf)}.btn.red{background:#ff8f84}.btn.gold{background:#ffd54a}.btn.sky{background:#9cc4ff}.btn.ghost{box-shadow:none;background:transparent;border-style:dashed}.btn.sm{padding:3px 9px;font-size:13px;border-width:2px;box-shadow:none;border-radius:8px}.btn.on{background:var(--violet);color:#fff}
      .ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
      .card{background:var(--cream-hi);border:3px solid var(--navy);border-radius:14px;padding:12px;display:grid;gap:8px}
      .qt{font-weight:900;font-size:21px;line-height:1.3}.row2{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:start}.th{height:86px;border-radius:10px;border:3px solid var(--navy);background:#e9f7ff center/cover}
      .dist{display:grid;grid-template-columns:30px 1fr 36px;gap:8px;align-items:center;font-weight:900}.dist .t{height:18px;border:2px solid var(--navy);border-radius:6px;background:#14122b22;overflow:hidden}.dist .t i{display:block;height:100%}
      .t2{display:flex;align-items:center;gap:8px}.tbar{flex:1;height:16px;border:3px solid var(--navy);border-radius:99px;background:#14122b22;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(#ffe27a,#f2c230);width:0}
      .pl{display:grid;grid-template-columns:24px 1fr 56px 32px;gap:5px;align-items:center;padding:4px 7px;border-radius:10px;background:var(--cream-hi);font-weight:800;font-size:14px}.pl.h{background:transparent;font-size:12px;opacity:.7;padding-top:0}
      .pl select{padding:2px;border:2px solid var(--navy);border-radius:6px;background:#fff;font-weight:800}.tm{width:12px;height:12px;border-radius:4px;border:2px solid var(--navy);display:inline-block;margin-right:3px}
      .stp{display:flex;gap:3px;justify-content:flex-end}.stp b{min-width:24px;height:24px;border-radius:7px;border:2px solid var(--navy);display:grid;place-items:center;background:#fff;font-size:13px;cursor:pointer;padding:0 4px}.stp .p{background:var(--leaf)}.stp .m{background:#ff8f84}
      .inp{padding:7px 10px;border:3px solid var(--navy);border-radius:10px;background:#fff;font-weight:800;color:var(--text);min-width:0}
      .log{display:flex;gap:16px;align-items:center;padding:0 14px;background:#14122bcc;color:#fff;border-radius:12px;font-size:13px;overflow:hidden;white-space:nowrap}
      .real{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.real div{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;padding:4px 8px;border-radius:8px;background:#fff;border:2px solid #d9bd8a;font-weight:800;font-size:14px}
      #auth{margin:auto;width:320px;display:grid;gap:10px;background:var(--cream);padding:20px;border-radius:14px}
      details summary{cursor:pointer;font-weight:900}
      .sw{display:flex;align-items:center;gap:8px;padding:6px 10px;border:3px solid var(--navy);border-radius:12px;background:var(--cream-hi);color:var(--text);font-weight:900;font-size:13px;cursor:pointer;text-align:left}
      .sw i{position:relative;flex:none;width:38px;height:22px;border-radius:99px;border:2px solid var(--navy);background:#b9b2a0;transition:background .15s}
      .sw i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--navy);box-sizing:content-box;width:12px;height:12px;transition:left .15s}
      .sw.on i{background:var(--leaf)}.sw.on i::after{left:18px}.sw.red.on i{background:#e5483c}.sw.red.on{background:#ffe1dd}
      .sws{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
      .q.sel{border-color:#e08a00;background:#fff0c9}.q.sel .btn{background:#ffd54a}
      #c-next{font-size:13px;font-weight:900;background:#fff0c9;border:2px solid #e08a00;border-radius:8px;padding:3px 8px}
      #sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
      .sc{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 6px;align-items:center;padding:5px 7px;border-radius:10px;background:var(--cream-hi);border:2px solid var(--navy);font-weight:800;font-size:13px}
      .sc .nm{grid-column:1/4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}.sc .nm i{font-style:normal;cursor:pointer;opacity:.55;font-size:16px}.sc .nm i.on{opacity:1}.sc .nm span{overflow:hidden;text-overflow:ellipsis}.sc .pt{text-align:center;font-weight:900;font-size:22px}
      .sc b{width:34px;height:30px;border-radius:8px;border:2px solid var(--navy);display:grid;place-items:center;background:#fff;font-size:18px;cursor:pointer;user-select:none}.sc b.m{background:#ffb3ab}.sc b.p{background:#b5e8a0}.sc b:active{transform:translateY(2px)}
      #tboard{display:flex;gap:6px;flex-wrap:wrap}.tc{flex:1 1 110px;min-height:70px;border:2px dashed var(--navy);border-radius:10px;padding:5px;display:flex;gap:4px;flex-wrap:wrap;align-content:flex-start}.tc.over{background:#fff3c4}.tc h4{margin:0;width:100%;font-size:12px}
      .chip{color:var(--text);padding:3px 8px;border-radius:99px;border:2px solid var(--navy);background:#fff;font-weight:800;font-size:13px;cursor:grab}
      #hist{display:grid;gap:5px;max-height:260px;overflow:auto}#hist details{background:#fff;border:2px solid var(--navy);border-radius:8px;padding:4px 8px;font-size:13px}#hist .un{text-decoration:line-through;opacity:.5}#hist .rw{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
      #rd{display:grid;gap:4px;font-weight:900;font-size:13px;overflow-x:auto}#rd div{display:grid;grid-auto-flow:column;grid-auto-columns:40px;gap:3px;align-items:center;text-align:center}#rd div>:first-child{width:44px;text-align:left}#rd .h{opacity:.6}#rd i{font-style:normal;border-radius:6px;background:#fff}#rd i.w{background:#ffe27a}
      .steps{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--cream);border-radius:14px;padding:8px 12px}
      .steps ol{list-style:none;margin:0;padding:0;display:flex;gap:4px}.steps li{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-weight:900;font-size:13px;color:#8b6a4a;background:#fff8}.steps li b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#d9bd8a;color:#fff;font-size:12px}
      .steps li.done{color:#6e9a3a}.steps li.done b{background:#6e9a3a}.steps li.now{background:#ffd54a;color:#14122b;box-shadow:0 0 0 2px #14122b}.steps li.now b{background:#14122b}.steps li small{font-weight:800;opacity:.75}
      .steps .todo{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.steps .todo span{font-weight:900;font-size:14px;margin-right:4px}
      .chip.rep{background:#ffd54a}
      .col details>div[style*="display:grid"]{grid-template-columns:minmax(0,1fr)}
      .seg{display:flex;flex-wrap:wrap;gap:4px;min-width:0}.pick{display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow:auto}.pick .btn.sm,.seg .btn.sm{font-size:12px;padding:3px 8px}
      [hidden]{display:none!important}
    </style>
  </head>
  <body>
    <div id="auth" hidden><h3>진행자 키</h3><input id="key" class="inp" type="text" placeholder="키" /><button id="login" class="btn go">입장</button><p id="aerr" style="color:#c0392b;margin:0"></p></div>
    <div class="bar" id="topbar" hidden><span class="logo">🎮 진행자</span><span class="pill" id="s-players">-</span><span class="pill" id="s-phase" style="background:var(--leaf)">-</span><span class="pill" id="s-left">-</span><button class="pill" id="reload-all" style="margin-left:auto;cursor:pointer;font:inherit;font-weight:900">↻ 전체 화면 새로고침</button><button class="pill" id="reload-me" style="cursor:pointer;font:inherit;font-weight:900">↻ 새로고침</button><a class="pill" href="/screen" target="_blank" style="text-decoration:none;color:inherit">화면 열기 ↗</a></div>
    <div class="steps" id="steps" hidden></div>
    <div class="g" id="app" hidden>
      <div class="col">
        <h3>문제</h3>
        <div id="qlist" style="display:grid;gap:6px"></div>
        <details><summary>＋ 문제 추가</summary>
          <div style="display:grid;gap:6px;margin-top:8px">
            <div style="display:flex;gap:6px"><div class="seg" id="q-type" data-v="ox" style="flex:1;min-width:0"><button class="btn sm on" data-t="ox">O/X</button><button class="btn sm" data-t="choice">객관식</button><button class="btn sm" data-t="real">현실</button><button class="btn sm" data-t="brawl">대난투</button><button class="btn sm" data-t="tourney">토너먼트</button><button class="btn sm" data-t="coin">동전</button><button class="btn sm" id="q-cteam" type="button" hidden>개인전</button></div></div>
            <input id="q-text" class="inp" placeholder="문제" /><input id="q-opts" class="inp" placeholder="객관식 보기 (쉼표로 구분)" />
            <div style="display:flex;gap:6px"><input id="q-ans" class="inp" placeholder="정답 · 점수" style="flex:1" /><input id="q-time" class="inp" type="number" value="15" min="5" max="900" title="제한시간(초)" style="width:70px" /><span style="align-self:center;font-weight:900">초</span></div>
            <input id="q-img" class="inp" placeholder="이미지 주소 (선택)" /><button class="btn go" id="q-add">추가</button>
          </div>
        </details>
        <details><summary>도구</summary>
          <div style="display:grid;gap:6px;margin-top:8px"><div style="display:flex;gap:6px"><button class="btn sm" id="gather">모이기</button><button class="btn sm" id="sbots">풀이봇 8</button><button class="btn sm" id="abots">공격봇 15</button><button class="btn sm" id="b-clear">봇 제거</button></div>
          <div style="display:flex;gap:6px"><button class="btn sm red" id="reset-coins">🪙 동전 초기화</button><button class="btn sm red" id="reset">점수 초기화</button></div></div>
        </details>
      </div>
      <div class="col" style="background:transparent;padding:0;gap:10px">
        <div class="card"><div class="row2"><div><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="pill" id="c-no">-</span><span class="pill" id="c-mode">-</span><span id="c-next" hidden></span></div><div class="qt" id="c-text">문제를 출제하세요</div></div><div class="th" id="c-img" hidden></div></div>
          <div class="t2"><span style="font-weight:900">⏱</span><button class="btn sm" id="qt-m">−10</button><b id="qt-v" style="min-width:52px;text-align:center">-</b><button class="btn sm" id="qt-p">＋10</button><div class="tbar"><i id="c-bar"></i></div></div></div>
        <div class="ctl" style="grid-template-columns:repeat(5,1fr)"><button class="btn go" id="ask">▶ 출제</button><button class="btn sky" id="vote">👊 1위 선택</button><button class="btn sky" id="premap">🗺 맵으로 이동</button><button class="btn sky" id="lobby">🏠 대기실로</button><button class="btn gold" id="end">✓ 정답 공개</button></div>
        <div class="card"><h3>진행 <em id="tools-state"></em></h3>
          <div class="ctl" style="grid-template-columns:repeat(4,1fr)"><button class="btn sm" id="t-m10">−10초</button><button class="btn sm" id="t-p10">＋10초</button><button class="btn sm" id="t-undo">↶ 점수 되돌리기</button><button class="btn sm gold" id="c-rain">🪙 동전 비</button></div>
          <div class="ctl" style="grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)"><button class="btn sm" id="q-prev">◀ 이전 문제</button><button class="btn sm" id="q-next">다음 문제 ▶</button><button class="btn sm gold" id="cal-fin" hidden>🏁 정산</button></div>
          <div class="sws"><button class="sw" id="t-pause"><i></i>일시정지</button><button class="sw" id="t-x2"><i></i>×2 라운드</button><button class="sw" id="t-qr"><i></i>QR</button><button class="sw" id="hideans"><i></i>정답 숨김</button><button class="sw red" id="t-god"><i></i>전원 무적</button><button class="sw red" id="t-noatk"><i></i>공격 금지</button><button class="sw red" id="t-noult"><i></i>궁극기 금지</button><button class="sw red" id="t-freeze"><i></i>비상 정지</button></div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>📺 중계</b><button class="btn sm" data-cast="auto">자동 1등</button><button class="btn sm" data-cast="off">전체 맵</button></div><div class="pick" id="cast-list"></div>
          <div style="display:flex;gap:6px"><b style="align-self:center">화면</b><button class="btn sm" data-screen="title">타이틀</button><button class="btn sm" data-screen="quiz">퀴즈</button><button class="btn sm" data-screen="map">맵</button><button class="btn sm" data-screen="rank">순위</button></div>
          <div style="display:grid;grid-template-columns:1fr 70px auto;gap:6px"><input class="inp" id="nt-text" maxlength="80" placeholder="전체 공지 (빔프로젝터·폰에 표시)"><input class="inp" id="nt-sec" type="number" value="8" min="2" max="30"><button class="btn sm go" id="nt-go" style="font-size:14px">공지</button></div>
        </div>
        <div class="card" id="distbox"><h3>실시간 응답 <em id="d-n"></em></h3><div id="dist" style="display:grid;gap:6px"></div></div>
        <div class="card" id="realbox" hidden><h3>현실 퀴즈 점수 <em>입력 → 확인 → 공개하기</em></h3><div class="real" id="real"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap" id="realteams"></div>
          <div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn gold" id="realok">확인</button><button class="btn go" id="realrev" disabled>공개하기</button></div></div>
        <div class="card" id="rdbox" hidden><h3>라운드 기록</h3><div id="rd"></div></div>
        <div class="card"><h3>기록 <em id="hist-n"></em></h3><div id="hist"></div></div>
        <div class="card"><h3>점수 부여 <em>보너스·현실 게임 결과</em></h3><div class="pick" id="aw-who" style="margin-bottom:8px"></div><div style="display:grid;grid-template-columns:1fr 90px auto;gap:8px"><span id="aw-sel" style="align-self:center;font-weight:900">대상을 누르세요</span><input class="inp" id="aw-n" type="number" step="0.5" value="1" /><button class="btn gold" id="aw-go">지급</button></div></div>
      </div>
      <div class="col">
        <h3>참가자 <em id="p-teams"></em></h3>
        <button class="btn go sm" id="t-auto" style="font-size:15px">🔀 2팀 무작위로 섞기</button>
        <details open><summary>팀 <small>끌어서 이동 · 눌러서 ★ 토너먼트 대표</small></summary><div id="tboard"></div></details>
        <div style="display:flex;gap:8px;align-items:center"><b>점수</b><input class="inp" id="adj-step" type="number" step="0.5" min="0.5" value="1" style="width:70px;padding:3px 8px"></div>
        <div id="sgrid"></div>
        <details><summary>편집 <small>이름·퇴장</small></summary>
        <div class="pl h" style="grid-template-columns:24px 1fr 56px 32px"><span>#</span><span>이름</span><span>점수</span><span></span></div>
        <div id="plist" style="display:grid;gap:5px"></div></details>
        <div id="tt" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
    </div>
    <div class="log" id="log" hidden></div>
    <script type="module" src="/src/host.js"></script>
  </body>
</html>
